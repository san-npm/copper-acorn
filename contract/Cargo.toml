[package]
name = "briarbridge-alchemy"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["legacy", "unit-testing"] }
