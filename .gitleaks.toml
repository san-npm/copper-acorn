[extend]
useDefault = true

[[allowlists]]
description = "Supabase publishable browser credential; server keys are never allowed"
regexTarget = "secret"
regexes = ['''^sb_publishable_[A-Za-z0-9_-]+$''']

[[rules]]
id = "supabase-secret-key"
description = "Supabase server secret must never enter the public repository"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]
