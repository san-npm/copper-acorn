[package]
name = "alchemy-sandbox"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
default-run = "alchemy-sandbox"

[dependencies]
anyhow = "1"
axum = "=0.8.9"
near-api = "=0.8.7"
near-sandbox = "=0.4.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }

reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
