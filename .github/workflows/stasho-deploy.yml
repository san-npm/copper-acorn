name: Stasho Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to deploy'
        required: false

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://api.stasho.xyz
      AUDIENCE: https://api.stasho.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Register deploy (installing)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN=""
          for WAIT in 0 2 4 8 16; do
            sleep "$WAIT"
            CURL_EXIT=0
            RESP=$(curl -sLS --max-time 30 -w '%{http_code}' \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN") || CURL_EXIT=$?
            HTTP=${RESP: -3} BODY=${RESP%???}
            [ "$CURL_EXIT" = 0 ] && [[ $HTTP == 2?? ]] && TOKEN=$(jq -er \
              '.value | strings | select(. != "" and . != "null")' <<<"$BODY" 2>/dev/null) && break
            TOKEN=""
            case $BODY in *eyJ*|*'"value"'*) BODY="(withheld, may hold a token)" ;; esac
            echo "OIDC token fetch failed: HTTP $HTTP, curl exit $CURL_EXIT, body:" \
              "$(head -c 200 <<<"$BODY" | tr '\r\n' ' ')" >&2
          done
          [ -n "$TOKEN" ] || { rm -f /tmp/build.log; echo "FATAL: OIDC_TOKEN_FETCH_FAILED: no token" \
            "from GitHub after 5 attempts (last answer: HTTP $HTTP). Re-run the job." \
            | tee /tmp/build.log >&2; exit 1; }
          curl -sLSf -X POST "$BACKEND_URL/api/deploy/report" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg msg "$COMMIT_MSG" --arg url "$ACTIONS_RUN_URL" \
                        '{"status":"installing","commitMessage":$msg,"actionsRunUrl":$url}')"

      - name: Install dependencies
        # --legacy-peer-deps opts into npm 6 resolution rules (warn on
        # peer-dep mismatch instead of failing). Necessary for the
        # ethers v5/v6 transitional state across the ecosystem: a v6 app
        # consuming an SDK whose declared peer is still v5 trips npm 7+
        # by default. Vercel and Netlify default to the same flag.
        run: |
          set -o pipefail
          npm install --legacy-peer-deps 2>&1 | tee /tmp/build.log

      - name: Report building
        run: |
          TOKEN=""
          for WAIT in 0 2 4 8 16; do
            sleep "$WAIT"
            CURL_EXIT=0
            RESP=$(curl -sLS --max-time 30 -w '%{http_code}' \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN") || CURL_EXIT=$?
            HTTP=${RESP: -3} BODY=${RESP%???}
            [ "$CURL_EXIT" = 0 ] && [[ $HTTP == 2?? ]] && TOKEN=$(jq -er \
              '.value | strings | select(. != "" and . != "null")' <<<"$BODY" 2>/dev/null) && break
            TOKEN=""
            case $BODY in *eyJ*|*'"value"'*) BODY="(withheld, may hold a token)" ;; esac
            echo "OIDC token fetch failed: HTTP $HTTP, curl exit $CURL_EXIT, body:" \
              "$(head -c 200 <<<"$BODY" | tr '\r\n' ' ')" >&2
          done
          [ -n "$TOKEN" ] || { rm -f /tmp/build.log; echo "FATAL: OIDC_TOKEN_FETCH_FAILED: no token" \
            "from GitHub after 5 attempts (last answer: HTTP $HTTP). Re-run the job." \
            | tee /tmp/build.log >&2; exit 1; }
          curl -sLSf -X POST "$BACKEND_URL/api/deploy/report" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"building"}'

      - name: Fetch build env
        run: |
          set -o pipefail
          {
            TOKEN=""
            for WAIT in 0 2 4 8 16; do
              sleep "$WAIT"
              CURL_EXIT=0
              RESP=$(curl -sLS --max-time 30 -w '%{http_code}' \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
                -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN") || CURL_EXIT=$?
              HTTP=${RESP: -3} BODY=${RESP%???}
              [ "$CURL_EXIT" = 0 ] && [[ $HTTP == 2?? ]] && TOKEN=$(jq -er \
                '.value | strings | select(. != "" and . != "null")' <<<"$BODY" 2>/dev/null) && break
              TOKEN=""
              case $BODY in *eyJ*|*'"value"'*) BODY="(withheld, may hold a token)" ;; esac
              echo "OIDC token fetch failed: HTTP $HTTP, curl exit $CURL_EXIT, body:" \
                "$(head -c 200 <<<"$BODY" | tr '\r\n' ' ')" >&2
            done
            [ -n "$TOKEN" ] || { rm -f /tmp/build.log; echo "FATAL: OIDC_TOKEN_FETCH_FAILED: no token" \
              "from GitHub after 5 attempts (last answer: HTTP $HTTP). Re-run the job." \
              | tee /tmp/build.log >&2; exit 1; }
            {
              curl -sLSf "$BACKEND_URL/api/deploy/env" -H "Authorization: Bearer $TOKEN" \
                -o /tmp/stasho-env.json \
                && jq -r '.env | to_entries[] | "\(.key)<<__SE__\n\(.value)\n__SE__"' \
                  /tmp/stasho-env.json >> "$GITHUB_ENV"
            } || { echo "FATAL: Could not read this project's build env from Stasho." \
              "Re-run the job." >&2; exit 1; }
          } 2>&1 | tee /tmp/build.log

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Report uploading
        run: |
          TOKEN=""
          for WAIT in 0 2 4 8 16; do
            sleep "$WAIT"
            CURL_EXIT=0
            RESP=$(curl -sLS --max-time 30 -w '%{http_code}' \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN") || CURL_EXIT=$?
            HTTP=${RESP: -3} BODY=${RESP%???}
            [ "$CURL_EXIT" = 0 ] && [[ $HTTP == 2?? ]] && TOKEN=$(jq -er \
              '.value | strings | select(. != "" and . != "null")' <<<"$BODY" 2>/dev/null) && break
            TOKEN=""
            case $BODY in *eyJ*|*'"value"'*) BODY="(withheld, may hold a token)" ;; esac
            echo "OIDC token fetch failed: HTTP $HTTP, curl exit $CURL_EXIT, body:" \
              "$(head -c 200 <<<"$BODY" | tr '\r\n' ' ')" >&2
          done
          [ -n "$TOKEN" ] || { rm -f /tmp/build.log; echo "FATAL: OIDC_TOKEN_FETCH_FAILED: no token" \
            "from GitHub after 5 attempts (last answer: HTTP $HTTP). Re-run the job." \
            | tee /tmp/build.log >&2; exit 1; }
          curl -sLSf -X POST "$BACKEND_URL/api/deploy/report" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"uploading"}'

      - name: Upload artifact
        run: |
          set -o pipefail
          {
            if [ ! -d "./dist" ]; then
              echo "Build produced no dist/. If this is a server app, switch the project's Deploy target to Server app in Settings." >&2
              exit 1
            fi
            SIZE_MB=$(du -sm "./dist" | cut -f1)
            if [ "$SIZE_MB" -gt 200 ]; then
              echo "Build is ${SIZE_MB} MB, the limit is 200 MB. Check the Output directory in Settings points at the built site. https://docs.stasho.xyz/guides/troubleshooting.html#too-large" >&2
              exit 1
            fi
            ENTRIES=$(find "./dist" | wc -l | tr -d ' ')
            if [ "$ENTRIES" -gt 10000 ]; then
              echo "Build has ${ENTRIES} files, the limit is 10000. Check the Output directory in Settings points at the built site. https://docs.stasho.xyz/guides/troubleshooting.html#too-large" >&2
              exit 1
            fi
            tar -czf /tmp/build.tar.gz -C ./dist .
            TOKEN=""
            for WAIT in 0 2 4 8 16; do
              sleep "$WAIT"
              CURL_EXIT=0
              RESP=$(curl -sLS --max-time 30 -w '%{http_code}' \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
                -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN") || CURL_EXIT=$?
              HTTP=${RESP: -3} BODY=${RESP%???}
              [ "$CURL_EXIT" = 0 ] && [[ $HTTP == 2?? ]] && TOKEN=$(jq -er \
                '.value | strings | select(. != "" and . != "null")' <<<"$BODY" 2>/dev/null) && break
              TOKEN=""
              case $BODY in *eyJ*|*'"value"'*) BODY="(withheld, may hold a token)" ;; esac
              echo "OIDC token fetch failed: HTTP $HTTP, curl exit $CURL_EXIT, body:" \
                "$(head -c 200 <<<"$BODY" | tr '\r\n' ' ')" >&2
            done
            [ -n "$TOKEN" ] || { rm -f /tmp/build.log; echo "FATAL: OIDC_TOKEN_FETCH_FAILED: no token" \
              "from GitHub after 5 attempts (last answer: HTTP $HTTP). Re-run the job." \
              | tee /tmp/build.log >&2; exit 1; }
            curl -sLS --fail-with-body -X POST "$BACKEND_URL/api/deploy/upload" \
              -H "Authorization: Bearer $TOKEN" \
              -F "artifact=@/tmp/build.tar.gz"
          } 2>&1 | tee /tmp/build.log

      - name: Report failure
        if: failure()
        # Tail of the failing step's combined stdout/stderr from
        # /tmp/build.log, led by its first error line. jq -n --arg safely escapes the
        # captured text so shell metacharacters in the build output can't
        # corrupt the JSON payload. Errors flow through the same dual-envelope
        # encryption as commit/branch/commitMessage on the backend.
        run: |
          LOG_TAIL=$(tail -n 50 /tmp/build.log 2>/dev/null | head -c 32768 || echo "")
          FIRST_ERROR=$(grep -a -m1 -iE \
            -e '^(error|fatal)\b|^npm err!|^npm error\b|^type error:|^##\[error\]|^::error::' \
            -e 'error TS[0-9]+:|ERR_PNPM_' \
            /tmp/build.log 2>/dev/null | cut -c1-300 || true)
          if [ -n "$FIRST_ERROR" ] && ! grep -qxF -- "$FIRST_ERROR" <<<"$LOG_TAIL"; then
            ERROR_TAIL=$(printf 'First error: %s\n\n%s' "$FIRST_ERROR" "$LOG_TAIL")
          else
            ERROR_TAIL=$LOG_TAIL
          fi
          TOKEN=""
          for WAIT in 0 2 4 8 16; do
            sleep "$WAIT"
            CURL_EXIT=0
            RESP=$(curl -sLS --max-time 30 -w '%{http_code}' \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN") || CURL_EXIT=$?
            HTTP=${RESP: -3} BODY=${RESP%???}
            [ "$CURL_EXIT" = 0 ] && [[ $HTTP == 2?? ]] && TOKEN=$(jq -er \
              '.value | strings | select(. != "" and . != "null")' <<<"$BODY" 2>/dev/null) && break
            TOKEN=""
            case $BODY in *eyJ*|*'"value"'*) BODY="(withheld, may hold a token)" ;; esac
            echo "OIDC token fetch failed: HTTP $HTTP, curl exit $CURL_EXIT, body:" \
              "$(head -c 200 <<<"$BODY" | tr '\r\n' ' ')" >&2
          done
          [ -n "$TOKEN" ] || { rm -f /tmp/build.log; echo "FATAL: OIDC_TOKEN_FETCH_FAILED: no token" \
            "from GitHub after 5 attempts (last answer: HTTP $HTTP). Re-run the job." \
            | tee /tmp/build.log >&2; exit 1; }
          curl -sLSf -X POST "$BACKEND_URL/api/deploy/report" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg err "$ERROR_TAIL" \
                        '{"status":"failed","error":$err}')"
